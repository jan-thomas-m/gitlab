---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Shared org pre-commit configuration
# fail_fast: true

repos:
  # # mete repo/identity, for debug
  # - repo: meta
  #   hooks:
  #     - id: identity
  #       name: 'Meta/identity: Just list the file scoped for tests'

  - repo: local
    hooks:
      # This ensures pre-commit is kept up to date
      - id: update-pre-commit
        name: update-pre-commit
        pass_filenames: false
        verbose: true
        language: system
        # Update if older than 3 days
        # yamllint disable rule:line-length
        entry: |
          bash -c '
            days=7
            if [[ $(( $(date +'%s') - $( stat -f '%m' .pre-commit-config.yaml) )) -gt $(( 3600 * 24 * ${days} )) ]] ; then
              echo "Updating pre-commit, as older than ${days} days"
              # pre-commit autoupdate
              prek update --cooldown-days 7
            else
              echo "Not updating pre-commit, as < ${days} days old"
            fi
            '
        # yamllint enable rule:line-length

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # - id: mixed-line-ending
      # - id: double-quote-string-fixer
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Removes UTF-8 BOM byte-order-marker
      - id: fix-byte-order-marker
      # Secrets
      # - id: detect-aws-credentials
      - id: detect-private-key
      # Python
      - id: check-ast
      - id: check-docstring-first
      - id: check-builtin-literals
      - id: requirements-txt-fixer
      # Filetypes
      # Leave this to yamllint
      # - id: check-yaml
      - id: check-json
      # - id: pretty-format-json
      - id: check-toml
      - id: check-xml
      # Files
      - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      # Repo
      - id: check-added-large-files
      - id: forbid-submodules
      - id: forbid-new-submodules
      - id: check-merge-conflict
      # - id: no-commit-to-branch
      #   args: [--branch, main]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf     # Forbid files containing CRLF end-lines to be committed
      - id: remove-crlf     # Replace CRLF end-lines by LF ones before committing
      - id: forbid-tabs     # Forbid files containing tabs to be committed
      # - id: remove-tabs     # Replace tabs by whitespaces before committing
      #   args: [--whitespaces-count, "2"]  # defaults to: 4

      # - id: chmod
      # Set file permissions
      #   args: ["644"]
      #   files: \.md$

      # - id: insert-license
      # Insert a short license disclaimer as a header comment in source files
      #   files: \.groovy$
      #   args:
      #     - --license-filepath
      #     - src/license_header.txt        # defaults to: LICENSE.txt
      #     - --comment-style
      #     - //                            # defaults to:  #
      #     - --use-current-year
      #     - --no-extra-eol                # see below

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  # https://github.com/zizmorcore/zizmor
  # zizmor is a static analysis tool for CI/CD systems.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    # Zizmor version.
    rev: v1.32.0
    hooks:
      # Run the linter.
      - id: zizmor
        args: [--no-progress, --fix]

  # https://github.com/rhysd/actionlint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        # Do not run shellcheck on action run: blocks,
        # as they are very likely to fail
        args: [-shellcheck=]
